# Used by the packaged desktop app (VisionTrack.exe), see packaging/build-desktop.ps1
spring:
  config:
    # Optional per-user overrides next to the log, e.g. the cloud export (README, "Enable the export")
    import: optional:file:${LOCALAPPDATA:${user.home}}/VisionTrack/application.yml

server:
  address: 127.0.0.1

logging:
  file:
    name: ${LOCALAPPDATA:${user.home}}/VisionTrack/visiontrack.log

visiontrack:
  open-browser: true
  tray-icon: true
  storage:
    directory: ${LOCALAPPDATA:${user.home}}/VisionTrack/uploads
  export:
    directory: ${LOCALAPPDATA:${user.home}}/VisionTrack/exports
