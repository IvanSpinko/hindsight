spring:
  application:
    name: visiontrack
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # Live export batching must not wait behind a slow cloud upload
        size: 2

server:
  port: 8080
  # This computer only; the APIs refuse other addresses too (web/LocalRequestsOnly)
  address: 127.0.0.1
  tomcat:
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info

visiontrack:
  # Open http://localhost:8080 in the default browser on startup (local development only)
  open-browser: true
  model:
    path: models/yoloworldx-960.onnx
    classes-path: models/classes.txt
    confidence-threshold: 0.35
    nms-threshold: 0.45
    # Runs on CUDA only: without an NVIDIA GPU, video analysis and the live camera report that one is required
    # Windows only; missing files are skipped. See OnnxYoloDetector.preloadNativeLibraries.
    native-preload:
      - C:/Windows/System32/msvcp140.dll
      - C:/Windows/System32/vcruntime140.dll
      - C:/Windows/System32/vcruntime140_1.dll
      - C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.6/bin/cudart64_12.dll
      - C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.6/bin/cublas64_12.dll
      - C:/Program Files/NVIDIA/CUDNN/v9.26/bin/12.9/x64/cudnn64_9.dll
  analysis:
    sample-fps: 5
    max-frame-dimension: 1280
    track-iou-threshold: 0.25
    track-max-gap-seconds: 1.5
    track-min-hits: 2
    # Save a copy of the video with object boxes drawn in (GET /api/analyses/{id}/video)
    annotated-video: true
  storage:
    directory: data/uploads
    delete-after-processing: true
    allowed-extensions: [mp4, mov, m4v, avi, mkv, webm, wmv, mpg, mpeg]
  jobs:
    concurrency: 1
    queue-capacity: 20
  # Every run's detections as gzipped JSON Lines (in-progress/ -> outbox/ -> uploaded/)
  export:
    directory: data/exports
    # Live camera: close a part file every N seconds; end a session after this much silence
    live-batch-seconds: 10
    live-idle-timeout-seconds: 60
  cloud:
    export:
      # Upload outbox files to S3 (raw/ prefix). Off by default: the app works fully offline.
      # Credentials come from the AWS default chain (e.g. AWS_PROFILE), never from this file.
      enabled: false
      bucket: ""
      prefix: ""
      region: eu-west-1
      # Named profile from ~/.aws/config (e.g. visiontrack-uploader); empty = AWS_PROFILE or the default profile
      profile: ""
      scan-interval-ms: 15000
  meetings:
    # One folder per meeting: <date>_<time>_<title> with video/, audio/ and meeting.json
    directory: ${user.home}/Documents/VisionTrack/Meetings
    # Screen frames per second: the screen is kept for people to rewatch (smooth like a video), it is not analysed
    screen-fps: 30
    # Recording is written in parts of this length, so a crash loses at most the unfinished part
    segment-seconds: 300
    max-recording-minutes: 360
    # Captures what the computer plays: the other participants of a call (packaging/build-loopback.ps1)
    system-audio-helper: tools/audio-loopback/audio-loopback.exe
    # Speech recognition (whisper.cpp on CUDA, see packaging/get-models.ps1). Each piece of speech gets its
    # own language, limited to these; the first one is the fallback.
    whisper:
      directory: tools/whisper
      model: models/whisper/ggml-large-v3-turbo-q8_0.bin
      vad-model: models/whisper/ggml-silero-v5.1.2.bin
      languages: [ru, en]
    # Notes written from the transcript by a local model (llama.cpp on CUDA, see packaging/get-models.ps1).
    # Without the model this step is skipped and only the transcript is saved.
    notes:
      directory: tools/llama
      model: models/llm/gemma-4-12b-it-qat-q4_0.gguf
      # Longer meetings are summarised in parts of this length, then merged
      chunk-minutes: 10
      # Context window of the model (prompt + answer) and the longest answer, in tokens
      context-tokens: 16384
      max-tokens: 4096
